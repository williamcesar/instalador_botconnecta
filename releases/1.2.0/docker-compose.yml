# ==============================================================================
# BotConnecta — Docker Compose Principal
# 6 serviços: frontend, backend, api_oficial, api_transcricao, postgres, redis
#
# Uso: docker compose --env-file .env up -d
# ==============================================================================

services:

  # ── Frontend (Painel React) ─────────────────────────────────────────────────
  frontend:
    image: ${DOCKERHUB_USER}/botconnecta-frontend:${VERSION}
    container_name: bc_frontend
    restart: always
    environment:
      - REACT_APP_BACKEND_URL=${BACKEND_URL}
      - REACT_APP_HOURS_CLOSE_TICKETS_AUTO=24
    command: sh -c "sed -i 's|http://localhost:8080|${BACKEND_URL}|g' /app/build/assets/*.js 2>/dev/null; node server.js"
    networks:
      botconnecta:
        ipv4_address: 172.28.1.10
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Backend (API Node.js / Express) ─────────────────────────────────────────
  backend:
    image: ${DOCKERHUB_USER}/botconnecta-backend:${VERSION}
    container_name: bc_backend
    restart: always
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME}
      - DB_USER=${POSTGRES_USER}
      - DB_PASS=${POSTGRES_PASSWORD}
      - REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - BACKEND_URL=${BACKEND_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - META_CONFIG_ID=${META_CONFIG_ID}
      - VERIFY_TOKEN=${VERIFY_TOKEN}
      - SUPPORT_NUMBER=${SUPPORT_NUMBER}
      - REQUIRE_BUSINESS_MANAGEMENT=${REQUIRE_BUSINESS_MANAGEMENT}
      - USER_LIMIT=${USER_LIMIT}
      - CONNECTIONS_LIMIT=${CONNECTIONS_LIMIT}
      - CLOSED_SEND_BY_ME=${CLOSED_SEND_BY_ME}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM=${MAIL_FROM}
      - MPACCESSTOKEN=${MPACCESSTOKEN}
      - ASAAS_TOKEN=${ASAAS_TOKEN}
      - STRIPE_PRIVATE=${STRIPE_PRIVATE}
      - URL_API_OFICIAL_PUBLIC=${URL_API_OFICIAL_PUBLIC}
      - TOKEN_API_OFICIAL=${TOKEN_API_OFICIAL}
      - SOCKET_ADMIN=${SOCKET_ADMIN}
    volumes:
      - backend_public:/home/node/app/public
    ports:
      - "8080"
    networks:
      botconnecta:
        ipv4_address: 172.28.1.20
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── API Oficial (WhatsApp Business) ─────────────────────────────────────────
  api_oficial:
    image: ${DOCKERHUB_USER}/botconnecta-api-oficial:${VERSION}
    container_name: bc_api_oficial
    restart: always
    environment:
      - PORT=6000
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${DB_NAME_OFICIAL}?schema=public
      - DATABASE_LINK=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${DB_NAME_OFICIAL}?schema=public
      - REDIS_URI=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - TOKEN_API=${TOKEN_API_OFICIAL}
      - BACKEND_URL=${BACKEND_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - FACEBOOK_APP_ID=${FACEBOOK_APP_ID}
      - FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}
      - META_CONFIG_ID=${META_CONFIG_ID}
      - VERIFY_TOKEN=${VERIFY_TOKEN}
      - ADMIN_NAME=${API_OFICIAL_ADMIN_NAME}
      - ADMIN_EMAIL=${API_OFICIAL_ADMIN_EMAIL}
      - ADMIN_PASSWORD=${API_OFICIAL_ADMIN_PASSWORD}
      - OFFICIAL_CAMPAIGN_CONCURRENCY=${OFFICIAL_CAMPAIGN_CONCURRENCY}
    volumes:
      - api_oficial_data:/home/node/app/data
    ports:
      - "6000"
    networks:
      botconnecta:
        ipv4_address: 172.28.1.30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ── API Transcrição (Whisper) ────────────────────────────────────────────────
  api_transcricao:
    image: ${DOCKERHUB_USER}/botconnecta-api-transcricao:${VERSION}
    container_name: bc_api_transcricao
    restart: always
    environment:
      - PORT=5000
      - BACKEND_URL=${BACKEND_URL}
    ports:
      - "5000"
    networks:
      botconnecta:
        ipv4_address: 172.28.1.40
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: bc_postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_MULTIPLE_DATABASES=${DB_NAME},${DB_NAME_OFICIAL}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    networks:
      botconnecta:
        ipv4_address: 172.28.1.50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bc_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      botconnecta:
        ipv4_address: 172.28.1.60
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Nginx (Reverse Proxy) ────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: bc_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/options-ssl-nginx.conf:/etc/nginx/options-ssl-nginx.conf:ro
      - ./docker/nginx/ssl-dhparams.pem:/etc/nginx/ssl-dhparams.pem:ro
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
      - backend_public:/var/www/backend_public:ro
    environment:
      - DOMAIN_FRONTEND=${DOMAIN_FRONTEND}
      - DOMAIN_BACKEND=${DOMAIN_BACKEND}
      - DOMAIN_API_OFICIAL=${DOMAIN_API_OFICIAL}
    networks:
      botconnecta:
        ipv4_address: 172.28.1.70
    depends_on:
      - frontend
      - backend
      - api_oficial

  # ── Certbot (SSL Let's Encrypt) ──────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      botconnecta:
        ipv4_address: 172.28.1.80

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_public:
    driver: local
  api_oficial_data:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

# ── Network ──────────────────────────────────────────────────────────────────
networks:
  botconnecta:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
